name: cu-chi-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cuchi
      POSTGRES_DB: cuchi
      POSTGRES_PASSWORD: local-development-only
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - development-database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cuchi -d cuchi"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  development-database:
