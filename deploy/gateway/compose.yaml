# Run in a dedicated Ubuntu VM, NOT alongside the portal on DSM.
name: cu-chi-gateway
services:
  gateway:
    image: ghcr.io/netherquartz/cu-chi-gateway:${CUCHI_GATEWAY_TAG:?Set a published sha tag}
    restart: unless-stopped
    ports:
      - "${GATEWAY_LAN_IP:?Set the VM LAN IPv4}:51820:51820/udp"
    environment:
      GATEWAY_LAN_IP: ${GATEWAY_LAN_IP:?Set the VM LAN IPv4}
      GATEWAY_ROUTER_IP: ${GATEWAY_ROUTER_IP:?Set the Keenetic LAN IPv4}
      GATEWAY_CLIENT_CIDRS: ${GATEWAY_CLIENT_CIDRS:-}
    volumes:
      - ./config:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run, /tmp]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    healthcheck:
      test: [CMD, /usr/local/bin/cuchi-gateway-healthcheck]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
