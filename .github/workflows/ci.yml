name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cuchi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cuchi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cuchi -d cuchi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cuchi:ci-only-password@127.0.0.1:5432/cuchi_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test browser session activity
        run: node tests/session-activity.cjs
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Verify automatic REALITY deployment and VLESS traffic
        run: XRAY_DEPLOY_TEST=true go test -v -count=1 ./internal/deployer -run TestXrayDeployment
      - run: go build ./cmd/cuchi
      - name: Verify database backup and restore
        run: sh deploy/backup/test.sh
  runtime:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      gateway_digest: ${{ steps.gateway-push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build pinned AmneziaWG runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/awg/Dockerfile
          load: true
          tags: cuchi-awg:test
          platforms: linux/amd64
          cache-from: type=gha,scope=awg
          cache-to: type=gha,scope=awg,mode=max
      - name: Test real AWG traffic, reconciliation and revocation
        env:
          AWG_TEST_IMAGE: cuchi-awg:test
          AWG_TEST_EGRESS: "true"
        run: go test -v -count=1 ./internal/awg
      - name: Build LAN gateway runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/awg/Dockerfile
          target: gateway
          load: true
          tags: cuchi-gateway:test
          platforms: linux/amd64
          cache-from: type=gha,scope=awg
          cache-to: type=gha,scope=gateway,mode=max
      - name: Test WG to AWG forwarding, DNS, MTU and fail-closed recovery
        env:
          AWG_TEST_IMAGE: cuchi-awg:test
          GATEWAY_TEST_IMAGE: cuchi-gateway:test
          AWG_TEST_EGRESS: "true"
        run: |
          sudo modprobe wireguard
          go test -v -count=1 ./internal/gateway
      - name: Test per-server WARP routing with isolated WireGuard exit
        env:
          WARP_TEST_IMAGE: cuchi-awg:test
          AWG_TEST_EGRESS: "true"
        run: go test -v -count=1 ./internal/egress
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested runtime
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/awg/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/netherquartz/cu-chi-awg:sha-${{ github.sha }}
          cache-from: type=gha,scope=awg
      - name: Publish tested gateway
        id: gateway-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/awg/Dockerfile
          target: gateway
          push: true
          platforms: linux/amd64
          tags: ghcr.io/netherquartz/cu-chi-gateway:sha-${{ github.sha }}
          cache-from: type=gha,scope=gateway
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/netherquartz/cu-chi
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            AWG_IMAGE=ghcr.io/netherquartz/cu-chi-awg@${{ needs.runtime.outputs.digest }}
            GATEWAY_IMAGE=ghcr.io/netherquartz/cu-chi-gateway@${{ needs.runtime.outputs.gateway_digest }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
